<html lang="ru">
<head>
    <title>Корзина - АСГАР</title>
    <link rel="stylesheet" href="/static/styles/ASGARupline.css">
    <link rel="stylesheet" href="/static/styles/intominiplany.css">
    <link rel="stylesheet" href="/static/styles/asgarheadlines.css">
    <link rel="stylesheet" href="/static/styles/servaviavariants.css">
</head>
<body>

<header class="site-header">
    <div class="header-container">
        <div class="logo">
            <a href="/">
                <img src="/static/img/logo.png" alt="ASGAR logo" class="logo-img">
                <span class="company-name">АСГАР</span>
            </a>
        </div>        
    </div>
</header>

<main class="main-content">
    <div class="services-title">
        <h1>КОРЗИНА</h1>
    </div>

  <div class="application-header">
    <div class="application-header-column items-count">
        <div class="column-title">Товаров в корзине</div>
        <div class="column-value">{{ len .items }}</div>
    </div>
    <div class="application-header-column flight-info">
        <div class="column-title">Рейс</div>
        <input type="text" class="flight-input-header column-value" placeholder="SU 1234" value="SU 1234">
    </div>
    <div class="application-header-column total-info">
        <div class="column-title">Общая стоимость</div>
        <div class="column-value">{{ .total }} руб.</div>
    </div>
    <!-- КНОПКА ОЧИСТКИ КОРЗИНЫ -->
    <div class="application-header-column clear-cart">
        <form action="/clear-miniplane" method="POST">
            <button type="submit" class="clear-btn" style="background: #ff6b6b; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                ОЧИСТИТЬ КОРЗИНУ
            </button>
        </form>
    </div>
</div>

    <!-- ТАБЛИЦА УСЛУГ -->
    <div class="cart-header">
        <div class="header-service">Услуга</div>
        <div class="header-quantity">Количество</div>
        <div class="header-price">Цена</div>
        <div class="header-actions"></div>
    </div>

    <div class="cart-items">
        {{ range .items }}
        <div class="cart-item">
            <div class="item-info">
                <img src="{{ .Service.Img }}" alt="{{ .Service.Name }}" class="cart-item-image">
                <div class="item-details">
                    <h3>{{ .Service.Name }}</h3>
                    <p>{{ .Service.Info }}</p>
                </div>
            </div>
            <div class="item-quantity">
                <input type="number" class="quantity-input" value="{{ .Quantity }}" min="1">
            </div>
            <div class="item-price">{{ .Price }} руб.</div>
            
            <!-- КНОПКА УДАЛЕНИЯ -->
            <div class="item-actions">
                <form action="/remove-from-miniplane" method="POST" class="remove-form">
                    <input type="hidden" name="subjserv_id" value="{{ .ID }}">
                    <button type="submit" class="remove-btn" title="Удалить из корзины" style="background: #ff4444; color: white; border: 2px solid #cc0000; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: bold;">
                        УДАЛИТЬ
                    </button>
                </form>
            </div>
        </div>
        {{ else }}
        <div class="empty-cart">
            <p>Корзина пуста</p>
        </div>
        {{ end }}
    </div>
</main>
</body>
</html>
