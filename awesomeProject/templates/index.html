<html lang="ru">
<head>
    <title>АСГАР</title>
    <link rel="stylesheet" href="/static/styles/card_service.css">
    <link rel="stylesheet" href="/static/styles/search_form.css">
    <link rel="stylesheet" href="/static/styles/header.css">
    <link rel="stylesheet" href="/static/styles/titles.css">
    <link rel="stylesheet" href="/static/styles/backet.css">
</head>
<body>
<!-- Новая шапка с поиском -->
<header class="site-header">
    <div class="header-container">
        <!-- Логотип компании -->
        <div class="logo">
            <a href="/hello">
                <img src="/static/img/logo.png" alt="Metoda Logo" class="logo-img">
                <span class="company-name">АСГАР</span>
            </a>
        </div>

        <!-- Поисковая строка -->
        <div class="search-container">
            <form action="/hello" method="GET" class="search-form">
                <input type="text" name="query" placeholder="Поиск услуг..." value="{{ .query }}" class="search-input">
                <button type="submit" class="search-button">
                    <img src="/static/img/searchicon.jpg" alt="Search" width="20">
                </button>
            </form>
        </div>

        <!-- Кнопка корзины -->
        <div class="cart-container">
            <a href="/cart" class="cart-button">
                <img src="/static/img/bascketicon.jpg" alt="Корзина" width="40">
                <span class="cart-count">2</span>
            </a>
        </div>
    </div>
</header>

<!-- Основной контент -->
<main class="main-content">
    <div class="services-title">
        <h1>СЕРВИСЫ И УСЛУГИ</h1>
    </div>

    <div class="services-container">
        {{ range .orders }}
        <div class="service-card">
            <div class="card-content">
                <!-- Добавляем изображение -->
                <img src="{{ .ImageURL }}" alt="{{ .Title }}" class="card-image">
                <h3>{{ .Title }}</h3>
                <!-- Используем настоящее описание из данных -->
                <p>{{ .Description }}</p>
                <!-- Добавляем отображение цены -->
                <div class="price">{{ .Price }}.</div>
                <a href="/order/{{ .ID }}" class="card-button">Подробнее</a>
            </div>
        </div>
        {{ else }}
        <div class="no-results">
            <p>Ничего не найдено. Попробуйте другой запрос.</p>
        </div>
        {{ end }}
    </div>
</main>
</body>
</html>
