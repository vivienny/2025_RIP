<html lang="ru">
<head>
    <title>Корзина - АСГАР</title>
    <link rel="stylesheet" href="/static/styles/search_form.css">
    <link rel="stylesheet" href="/static/styles/header.css">
    <link rel="stylesheet" href="/static/styles/backet.css">
    <link rel="stylesheet" href="/static/styles/titles.css">
    <link rel="stylesheet" href="/static/styles/card_service.css">
</head>
<body>
<header class="site-header">
    <div class="header-container">
        <div class="logo">
            <a href="/hello">
                <img src="/static/img/logo.png" alt="Metoda Logo" class="logo-img">
                <span class="company-name">АСГАР</span>
            </a>
        </div>

        <div class="search-container">
            <form action="/hello" method="GET" class="search-form">
                <input type="text" name="query" placeholder="Поиск услуг..." value="" class="search-input">
                <button type="submit" class="search-button">
                    <img src="/static/img/searchicon.jpg" alt="Search" width="20">
                </button>
            </form>
        </div>

        <div class="cart-container">
            <a href="/cart" class="cart-button active">
                <img src="/static/img/bascketicon.jpg" alt="Корзина" width="40">
                <span class="cart-count">2</span>
            </a>
        </div>
    </div>
</header>

<main class="main-content">
    <div class="services-title">
        <h1>КОРЗИНА</h1>
    </div>

    <div class="cart-items">
        <!-- Товар 1 -->
        <div class="cart-item">
            <img src="http://localhost:9000/test//jeta1.jpg" alt="Авиационное топливо" class="cart-item-image">
            
            <div class="item-info">
                <h3>Авиационное топливо JET A-1</h3>
                <p>Высококачественное топливо для газотурбинных двигателей</p>
            </div>
            
            <!-- Блок количества -->
            <div class="item-quantity">
                <input type="number" class="quantity-input" value="1" min="1">
            </div>
            
            <!-- Блок цены и кнопки -->
            <div class="item-right-side">
                <span class="item-price">85 000 руб.</span>
                <button class="remove-item">Удалить</button>
            </div>
        </div>
        
        <!-- Товар 2 -->
        <div class="cart-item">
            <img src="http://localhost:9000/test//noice.jpg" alt="Антифриз" class="cart-item-image">
            
            <div class="item-info">
                <h3>Авиационное масло</h3>
                <p>Состав от обледенения ВС</p>
            </div>
            
            <!-- Блок количества -->
            <div class="item-quantity">
                <input type="number" class="quantity-input" value="1" min="1">
            </div>
            
            <!-- Блок цены и кнопки -->
            <div class="item-right-side">
                <span class="item-price">68 000 руб.</span>
                <button class="remove-item">Удалить</button>
            </div>
        </div>
    </div>
    
    <div class="cart-summary">
        <div class="total-price">
            <strong>Итого: 153 000 руб.</strong>
        </div>
        <button class="checkout-button">Оформить заказ</button>
    </div>
</main>
</body>
</html>
